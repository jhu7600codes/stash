name: iOS build
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode (26 for liquid glass)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Generate the project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Stash.xcodeproj -scheme Stash -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Stash.app
      - name: Show errors
        if: failure()
        run: grep -E "error:" ios/build.log | sort -u | head -80
      - name: Package Stash.ipa
        run: |
          mkdir Payload && cp -R ios/build/Build/Products/Release-iphoneos/Stash.app Payload/
          zip -qry Stash.ipa Payload && ls -la Stash.ipa
      - uses: actions/upload-artifact@v4
        with: { name: Stash-ipa, path: Stash.ipa }
      - name: Build for the simulator (Appetize)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Stash.xcodeproj -scheme Stash -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|BUILD" || true
          test -d sim/Build/Products/Release-iphonesimulator/Stash.app
          cd sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Stash-sim.zip" Stash.app
          ls -la "$GITHUB_WORKSPACE/Stash-sim.zip"
      - uses: actions/upload-artifact@v4
        with: { name: Stash-sim, path: Stash-sim.zip }
      - name: Publish (releases/download/ios/…)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios
          name: Stash for iOS (latest build)
          body: |
            **Stash.ipa** — unsigned, for sideloading with AltStore / SideStore (signs with your own free Apple ID) or TrollStore.
            **Stash-sim.zip** — a simulator build, upload it to Appetize.io to run it in the browser.
            Rebuilt on every change to ios/.
          files: |
            Stash.ipa
            Stash-sim.zip
          prerelease: true
          make_latest: false
